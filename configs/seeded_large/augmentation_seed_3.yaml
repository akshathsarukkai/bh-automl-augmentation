seed: 3
dataset:
  name: buchwald_hartwig
  path: data/processed/bh_clean_stress.csv
splits:
  method: random
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1
low_data:
  enabled: true
  train_fractions:
  - 0.01
  - 0.05
  - 0.1
features:
  kind: reaction_role_concat
  n_bits: 2048
  radius: 2
models:
- random_forest
metrics:
- rmse
- mae
- r2
- spearman
augmentation:
  condition_recombine_pseudolabel:
    enabled: true
    synthetic_multiplier: 1.0
    max_synthetic_rows: 6000
    teacher_model: random_forest
    min_neighbor_similarity: 0.8
    random_state: 42
    synthetic_weighting:
      enabled: true
      real_weight: 1.0
      synthetic_weight_mode: nearest_similarity
      min_synthetic_weight: 0.25
      max_synthetic_weight: 0.85
augmentation_search:
  enabled: true
  method: condition_recombine_pseudolabel
  selection_metric: rmse
  selection_split: valid
  lower_is_better: true
  synthetic_multipliers:
  - 0.25
  - 0.5
  - 1.0
  - 1.5
  - 2.0
  - 3.0
  min_neighbor_similarities:
  - 0.7
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  teacher_models:
  - ridge
  - random_forest
  random_states:
  - 0
  - 1
  - 2
  - 3
  - 4
  max_synthetic_rows: 6000
output:
  metrics_path: results/seeded_large/seed_3/selected_policy_metrics.csv
  search_metrics_path: results/seeded_large/seed_3/policy_search_metrics.csv
  selected_policies_path: results/seeded_large/seed_3/selected_policies.csv
  split_metadata_path: results/seeded_large/seed_3/augmentation_split_metadata.csv
