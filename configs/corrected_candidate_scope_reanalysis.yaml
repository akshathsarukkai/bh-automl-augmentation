# Development reanalysis of candidate-scope semantics for low-data condition
# transfer. Validation-only: this configuration never materializes an outer-test
# outcome and never claims an entry in the repository-global evaluation
# registry. The preregistered confirmatory experiment does that separately --
# see PREREGISTRATION_OBSERVED_ONLY_TRANSFER.md.
#
# It produces three result families:
#   observed_only_condition_transfer        eligibility from labeled_train only
#   globally_unmeasured_condition_transfer  the historical prospective control
#   withheld_cell_transfer_oracle           retrospective reconstruction metrics

scientific_run: true

dataset:
  path: data/processed/bh_canonical_roles_v1.csv

splits:
  directory: results/corrected_canonical_splits
  # Seeds 0-4 at fractions 0.01/0.05/0.10 are unconsumed evaluation units, and
  # they are deliberately disjoint from the confirmatory seeds 5-14. This runner
  # reads only labeled-train, hidden-outer-train and validation; no outer test
  # is materialized and no registry identity is claimed.
  seeds: [0, 1, 2, 3, 4]
  train_fractions: [0.01, 0.05, 0.10]

candidate_scope:
  modes:
    - observed_only_low_data
    - globally_unmeasured_prospective

features:
  kind: bh_role_separated
  n_bits: 2048
  radius: 2
  fingerprint_backend: rdkit

transfer:
  anonymous:
    donor_strategy: nearest_substrate
    synthetic_multiplier: 1.0
    n_neighbors: 10
    label_strategy: teacher_ensemble
    teacher_models: [extra_trees, random_forest]
    max_teacher_std: null
    min_similarity: 0.0
    high_yield_threshold: 80.0
    clip_y_min: 0.0
    clip_y_max: 100.0
    candidates_per_real: 2
    donor_similarity_n_bits: 2048
    donor_similarity_radius: 2
    donor_similarity_backend: rdkit
    role_change_requirement: all
    fallback_policy: reject
    max_candidates_per_source: 1
    requested_roles: [ligand, base]
  typed:
    role_transfer_mode: ligand_base
    donor_strategy: same_substrate_different_role
    label_strategy: teacher_ensemble
    synthetic_multiplier: 1.0
    max_candidates_per_source: 1
    teacher_models: [extra_trees, random_forest]
    max_teacher_std: null
    min_similarity: 0.0
    clip_y_min: 0.0
    clip_y_max: 100.0
    max_resample_attempts: 10
    donor_similarity_n_bits: 2048
    donor_similarity_radius: 2
    donor_similarity_backend: rdkit
    role_change_requirement: all
    fallback_policy: reject

models:
  - name: xgboost
    params:
      n_estimators: 300
      max_depth: 4
      learning_rate: 0.05
      n_jobs: 1
      tree_method: hist

oracle:
  high_yield_threshold: 80.0
  top_k_fractions: [0.1, 0.2]

metrics: [rmse, mae, r2, spearman]

output:
  directory: results/corrected_candidate_scope_reanalysis
