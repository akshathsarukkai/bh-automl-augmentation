dataset:
  path: data/processed/bh_canonical_roles_v1.csv
splits:
  canonical_directory: results/corrected_canonical_splits
  random_seeds: [0, 1, 2, 3, 4]
  random_fractions: [0.2, 1.0]
hidden_experiment:
  n_condition_groups: 3
  minimum_hidden_rows: 2
  panel_salt: phase12-hidden-condition-panel-v1
  validation_partition_salt: phase12-validation-condition-halves-v1
  requested_role_sets:
    - [ligand]
    - [base]
    - [solvent_or_additive]
    - [ligand, base]
    - [ligand, solvent_or_additive]
    - [base, solvent_or_additive]
    - [catalyst]
    - [ligand, base, solvent_or_additive]
    - [catalyst, ligand, base, solvent_or_additive]
  donor_strategies: [random, nearest_substrate]
  similarity_n_bits: 256
  similarity_radius: 2
uncertainty:
  coverage: 0.9
  max_calibration_error: 0.15
  min_retained_fraction: 0.5
  methods:
    bootstrap_extra_trees:
      bootstrap_members: 5
      bootstrap_trees_per_member: 8
    seeded_xgboost:
      xgboost_seeds: [0, 1, 2]
      xgboost_params:
        n_estimators: 20
        max_depth: 3
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.8
        n_jobs: 1
        tree_method: hist
    quantile_gradient_boosting:
      quantile_n_estimators: 30
      quantile_max_depth: 2
      quantile_learning_rate: 0.05
    split_conformal_ridge:
      ridge_alpha: 1.0
    distance_aware_ridge:
      ridge_alpha: 1.0
    heterogeneous_disagreement:
      ridge_alpha: 1.0
      heterogeneous_tree_estimators: 20
features:
  kind: bh_role_separated
  n_bits: 256
  radius: 2
  fingerprint_backend: rdkit
base_seed: 0
output:
  directory: results/corrected_hidden_measured_calibration_phase12
