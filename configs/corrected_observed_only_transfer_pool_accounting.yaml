# Pool accounting for the preregistered observed-only confirmatory experiment.
#
# PREREGISTRATION_OBSERVED_ONLY_TRANSFER.md section 9 requires the accepted-
# synthetic-row count per evaluation unit under BOTH eligibility rules. The
# frozen-policy protocol run of 2026-09-03 recorded no per-unit counts, so this
# configuration regenerates every confirmatory unit's candidate pool -- same
# dataset, same phase15 split directory, same seeds 6-14, same fraction 0.05,
# same anonymous transfer configuration with random_state = seed -- under each
# rule, validation only. Candidate counts do not depend on the downstream model.
#
# It reads labeled-train, hidden-outer-train and validation rows only. No outer
# test is materialized and no evaluation-registry identity is claimed; the
# leakage_contracts.json it writes records both facts and the analysis refuses
# a bundle that says otherwise.
#
# The withheld-cell oracle it also produces is the preregistered secondary,
# non-selecting diagnostic (section 8) for the confirmatory seeds.

scientific_run: true

dataset:
  path: data/processed/bh_canonical_roles_v1.csv

splits:
  directory: results/corrected_canonical_splits_phase15
  # The confirmatory seeds and fraction. This runner reads only labeled-train,
  # hidden-outer-train and validation; the outer tests these units consumed on
  # 2026-09-03 are never materialized here and no registry identity is claimed.
  seeds: [6, 7, 8, 9, 10, 11, 12, 13, 14]
  train_fractions: [0.05]

candidate_scope:
  modes:
    - observed_only_low_data
    - globally_unmeasured_prospective

features:
  kind: bh_role_separated
  n_bits: 2048
  radius: 2
  fingerprint_backend: rdkit

transfer:
  anonymous:
    donor_strategy: nearest_substrate
    synthetic_multiplier: 1.0
    n_neighbors: 10
    label_strategy: teacher_ensemble
    teacher_models: [extra_trees, random_forest]
    max_teacher_std: null
    min_similarity: 0.0
    high_yield_threshold: 80.0
    clip_y_min: 0.0
    clip_y_max: 100.0
    candidates_per_real: 2
    donor_similarity_n_bits: 2048
    donor_similarity_radius: 2
    donor_similarity_backend: rdkit
    role_change_requirement: all
    fallback_policy: reject
    max_candidates_per_source: 1
    requested_roles: [ligand, base]
  typed:
    role_transfer_mode: ligand_base
    donor_strategy: same_substrate_different_role
    label_strategy: teacher_ensemble
    synthetic_multiplier: 1.0
    max_candidates_per_source: 1
    teacher_models: [extra_trees, random_forest]
    max_teacher_std: null
    min_similarity: 0.0
    clip_y_min: 0.0
    clip_y_max: 100.0
    max_resample_attempts: 10
    donor_similarity_n_bits: 2048
    donor_similarity_radius: 2
    donor_similarity_backend: rdkit
    role_change_requirement: all
    fallback_policy: reject

models:
  - name: xgboost
    params:
      n_estimators: 300
      max_depth: 4
      learning_rate: 0.05
      n_jobs: 1
      tree_method: hist

oracle:
  high_yield_threshold: 80.0
  top_k_fractions: [0.1, 0.2]

metrics: [rmse, mae, r2, spearman]

output:
  directory: results/corrected_observed_only_transfer_pool_accounting_v1
