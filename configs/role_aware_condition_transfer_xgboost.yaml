seed: 42
seeds: [0, 1, 2, 3, 4]

dataset:
  path: data/processed/bh_clean_stress.csv

splits:
  method: random
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1

low_data:
  enabled: true
  train_fractions: [0.01, 0.05, 0.10, 0.20]

features:
  kind: reaction_role_concat
  n_bits: 2048
  radius: 2

models:
  - name: xgboost
    params:
      n_estimators: 10
      max_depth: 4
      learning_rate: 0.05
      subsample: 0.9
      colsample_bytree: 0.9

metrics:
  - rmse
  - mae
  - r2
  - spearman

role_aware_condition_transfer:
  enabled: true
  role_transfer_modes:
    - ligand_only
    - base_only
    - solvent_or_additive_only
    - ligand_base
    - base_solvent_or_additive
    - catalyst_ligand_base
    - full_condition_block
  donor_strategies:
    - random
    - nearest_substrate
    - high_yield_nearest
    - diverse_role_value
  label_strategies:
    - teacher_ensemble
    - uncertainty_filtered_teacher
  synthetic_multipliers: [0.5]
  max_candidates_per_source: 3
  max_policies: 7
  max_teacher_stds: [15.0]
  min_similarities: [0.2]
  clip_y_min: 0.0
  clip_y_max: 100.0
  max_resample_attempts: 8
  teacher_models:
    - ridge
    - random_forest

selection:
  split: valid
  metric: rmse
  lower_is_better: true

output:
  directory: results/role_aware_condition_transfer_xgboost
  policy_metrics_path: results/role_aware_condition_transfer_xgboost/policy_metrics.csv
  selected_policies_path: results/role_aware_condition_transfer_xgboost/selected_policies.csv
  selected_policy_metrics_path: results/role_aware_condition_transfer_xgboost/selected_policy_metrics.csv
  summary_path: results/role_aware_condition_transfer_xgboost/summary.csv
  role_transfer_audit_path: results/role_aware_condition_transfer_xgboost/role_transfer_audit.csv
  role_transfer_vs_real_only_same_model_by_seed_path: results/role_aware_condition_transfer_xgboost/role_transfer_vs_real_only_same_model_by_seed.csv
  role_transfer_vs_real_only_same_model_summary_path: results/role_aware_condition_transfer_xgboost/role_transfer_vs_real_only_same_model_summary.csv
  role_transfer_vs_original_rf_by_seed_path: results/role_aware_condition_transfer_xgboost/role_transfer_vs_original_rf_by_seed.csv
  role_transfer_vs_original_rf_summary_path: results/role_aware_condition_transfer_xgboost/role_transfer_vs_original_rf_summary.csv
