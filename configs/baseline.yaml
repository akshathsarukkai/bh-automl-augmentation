seed: 42
dataset:
  name: buchwald_hartwig
  path: data/processed/bh_clean.csv
splits:
  method: random
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1
low_data:
  enabled: false
  train_fractions: [0.01, 0.05, 0.1, 0.2, 0.5]
features:
  kind: fp_plus_conditions
models:
  - ridge
  - random_forest
metrics:
  - rmse
  - mae
  - r2
  - spearman
