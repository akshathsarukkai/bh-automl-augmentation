# Phase 18 fast smoke configuration.
#
# Identical protocol and identical strategy set as the production config, with a
# single evaluation unit, a short budget and small fingerprints. The random
# replicate floor of 200 is a hard contract and is not relaxed here.
dataset:
  path: data/processed/bh_canonical_roles_v1.csv
splits:
  canonical_directory: results/corrected_canonical_splits
  random_seeds: [0]
  pool_train_fraction: 1.0
campaign:
  seed_pool_size: 48
  rounds: 3
  batch_size: 8
  random_replicates: 200
  top_k: 20
  high_yield_threshold: 70.0
model:
  uncertainty_method: bootstrap_extra_trees
  coverage: 0.9
  calibration_fraction: 0.3
  minimum_calibration_rows: 6
  estimator_params:
    bootstrap_members: 3
    bootstrap_trees_per_member: 4
strategies:
  ucb_beta: 1.0
  expected_improvement_xi: 0.0
  diversity_penalty: 20.0
  support_distance_yield_weight: 0.001
features:
  kind: bh_role_separated
  n_bits: 32
  radius: 2
  fingerprint_backend: rdkit
base_seed: 0
output:
  directory: results/corrected_recommendation_simulation_phase18_smoke
