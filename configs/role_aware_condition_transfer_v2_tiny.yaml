seed: 0
seeds: [0]

dataset:
  path: data/processed/bh_clean_stress.csv

splits:
  method: random
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1

low_data:
  enabled: true
  train_fractions: [0.01]

features:
  kind: reaction_role_concat
  n_bits: 512
  radius: 2

models:
  - name: xgboost
    params:
      n_estimators: 5
      max_depth: 3
      learning_rate: 0.1
      tree_method: hist

metrics:
  - rmse
  - mae
  - r2
  - spearman

role_aware_condition_transfer:
  enabled: true
  exclude_invariant_roles: true
  allow_zero_synthetic_policy_selection: false
  role_transfer_modes: [ligand_only, ligand_base_solvent_or_additive]
  donor_strategies: [same_nontransferred_roles]
  label_strategies: [teacher_ensemble]
  synthetic_multipliers: [0.5]
  max_candidates_per_source: 2
  max_teacher_stds: [15.0]
  min_similarities: [0.0]
  clip_y_min: 0.0
  clip_y_max: 100.0
  max_resample_attempts: 5
  teacher_models:
    - ridge

selection:
  split: valid
  metric: rmse
  lower_is_better: true

output:
  directory: results/role_aware_condition_transfer_v2_tiny
  policy_metrics_path: results/role_aware_condition_transfer_v2_tiny/policy_metrics.csv
  selected_policies_path: results/role_aware_condition_transfer_v2_tiny/selected_policies.csv
  selected_policy_metrics_path: results/role_aware_condition_transfer_v2_tiny/selected_policy_metrics.csv
  summary_path: results/role_aware_condition_transfer_v2_tiny/summary.csv
  role_transfer_audit_path: results/role_aware_condition_transfer_v2_tiny/role_transfer_audit.csv
  role_value_counts_path: results/role_aware_condition_transfer_v2_tiny/role_value_counts.csv
  role_transfer_vs_real_only_same_model_by_seed_path: results/role_aware_condition_transfer_v2_tiny/role_transfer_vs_real_only_same_model_by_seed.csv
  role_transfer_vs_real_only_same_model_summary_path: results/role_aware_condition_transfer_v2_tiny/role_transfer_vs_real_only_same_model_summary.csv
  role_transfer_vs_original_rf_by_seed_path: results/role_aware_condition_transfer_v2_tiny/role_transfer_vs_original_rf_by_seed.csv
  role_transfer_vs_original_rf_summary_path: results/role_aware_condition_transfer_v2_tiny/role_transfer_vs_original_rf_summary.csv
