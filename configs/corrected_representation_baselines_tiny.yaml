seed: 0
seeds: [0]
corrected_revalidation:
  enabled: true
dataset:
  path: data/processed/bh_clean_stress.csv
splits:
  method: random
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1
low_data:
  enabled: true
  train_fractions: [0.01]
features:
  representations:
    - reaction_section_concat
    - reaction_section_concat_delta
    - bh_role_separated
    - bh_role_separated_delta
  n_bits: 64
  radius: 2
  fingerprint_backend: rdkit
models:
  - name: xgboost
    params:
      n_estimators: 5
      max_depth: 3
      learning_rate: 0.1
      n_jobs: -1
      tree_method: hist
metrics: [rmse, mae, r2, spearman]
output:
  directory: results/corrected_representation_baselines_tiny
