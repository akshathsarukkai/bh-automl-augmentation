seed: 42
seeds: [0, 1, 2, 3, 4]

dataset:
  path: data/processed/bh_clean_stress.csv

splits:
  method: random
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1

low_data:
  enabled: true
  train_fractions: [0.01, 0.05, 0.10, 0.20]

features:
  kind: reaction_role_concat
  n_bits: 2048
  radius: 2

models:
  - name: xgboost
    params:
      n_estimators: 300
      max_depth: 4
      learning_rate: 0.05
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.0
      objective: reg:squarederror
      n_jobs: -1
      tree_method: hist

metrics:
  - rmse
  - mae
  - r2
  - spearman

role_aware_condition_transfer:
  enabled: true
  exclude_invariant_roles: true
  allow_zero_synthetic_policy_selection: false
  role_transfer_modes:
    - ligand_only
    - base_only
    - solvent_or_additive_only
    - ligand_base
    - ligand_solvent_or_additive
    - base_solvent_or_additive
    - ligand_base_solvent_or_additive
  donor_strategies:
    - same_nontransferred_roles
    - matched_product_or_reactant_key
    - high_yield_same_context
  label_strategies:
    - teacher_ensemble
    - uncertainty_filtered_teacher
  synthetic_multipliers: [0.5, 1.0]
  max_candidates_per_source: 3
  max_teacher_stds: [15.0]
  min_similarities: [0.0]
  max_policies: 7
  clip_y_min: 0.0
  clip_y_max: 100.0
  max_resample_attempts: 8
  teacher_models:
    - ridge
    - random_forest

selection:
  split: valid
  metric: rmse
  lower_is_better: true

output:
  directory: results/role_aware_condition_transfer_v2_xgboost
  policy_metrics_path: results/role_aware_condition_transfer_v2_xgboost/policy_metrics.csv
  selected_policies_path: results/role_aware_condition_transfer_v2_xgboost/selected_policies.csv
  selected_policy_metrics_path: results/role_aware_condition_transfer_v2_xgboost/selected_policy_metrics.csv
  summary_path: results/role_aware_condition_transfer_v2_xgboost/summary.csv
  role_transfer_audit_path: results/role_aware_condition_transfer_v2_xgboost/role_transfer_audit.csv
  role_value_counts_path: results/role_aware_condition_transfer_v2_xgboost/role_value_counts.csv
  role_transfer_vs_real_only_same_model_by_seed_path: results/role_aware_condition_transfer_v2_xgboost/role_transfer_vs_real_only_same_model_by_seed.csv
  role_transfer_vs_real_only_same_model_summary_path: results/role_aware_condition_transfer_v2_xgboost/role_transfer_vs_real_only_same_model_summary.csv
  role_transfer_vs_original_rf_by_seed_path: results/role_aware_condition_transfer_v2_xgboost/role_transfer_vs_original_rf_by_seed.csv
  role_transfer_vs_original_rf_summary_path: results/role_aware_condition_transfer_v2_xgboost/role_transfer_vs_original_rf_summary.csv
