seed: 42
dataset:
  name: buchwald_hartwig
  path: data/processed/bh_clean.csv
splits:
  method: random
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1
features:
  kind: reaction_role_concat_delta
  n_bits: 2048
  radius: 2
automl:
  enabled: true
  n_trials: 10
  primary_metric: validation_top_k_hit_rate
  top_k: 3
  high_yield_threshold: 70
  candidate_models:
    - ridge
    - random_forest
    - extratrees
  feature_sets:
    - reaction_morgan_sum
    - reaction_role_concat
    - reaction_role_concat_delta
  augmentation_types:
    - none
  augmentation_ratios:
    - 1
    - 2
    - 5
output:
  trial_table_path: results/automl/trials.csv
  best_config_path: results/automl/best_config.json
  final_test_metrics_path: results/automl/final_test_metrics.csv
