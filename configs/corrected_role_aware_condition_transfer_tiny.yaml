seed: 0
seeds: [0]
corrected_revalidation:
  enabled: true
dataset:
  path: data/processed/bh_clean_stress.csv
splits:
  method: random
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1
low_data:
  enabled: true
  train_fractions: [0.01]
features:
  kind: bh_role_separated
  n_bits: 64
  radius: 2
  fingerprint_backend: rdkit
models:
  - name: xgboost
    params:
      n_estimators: 5
      max_depth: 3
      learning_rate: 0.1
      n_jobs: -1
      tree_method: hist
metrics: [rmse, mae, r2, spearman]
role_aware_condition_transfer:
  enabled: true
  role_change_requirement: all
  fallback_policy: reject
  exclude_invariant_roles: true
  allow_zero_synthetic_policy_selection: false
  role_transfer_modes: [ligand_base_solvent_or_additive]
  donor_strategies: [matched_product_or_reactant_key]
  label_strategies: [teacher_ensemble]
  synthetic_multipliers: [0.5]
  max_candidates_per_source: 3
  max_teacher_stds: [null]
  min_similarities: [0.0]
  clip_y_min: 0.0
  clip_y_max: 100.0
  max_resample_attempts: 8
  teacher_models: [ridge]
  donor_similarity_n_bits: 256
  donor_similarity_radius: 2
  donor_similarity_backend: rdkit
selection:
  split: valid
  metric: rmse
  lower_is_better: true
output:
  directory: results/corrected_role_aware_condition_transfer_tiny
