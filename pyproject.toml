[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bh-automl-augmentation"
version = "0.1.0"
description = "MVP research code for safe augmentation in low-data Buchwald-Hartwig yield prediction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "PyYAML",
  "torch",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root must be on sys.path, not just src. Several test modules
# import `tests.canonical_test_utils` and `scripts.*`, and only `python -m
# pytest` puts the working directory on sys.path -- the bare `pytest` console
# script does not, and neither does the editable install, whose package
# discovery is scoped to src. Without the "." entry those modules fail to
# import and pytest exits on collection errors.
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
]
